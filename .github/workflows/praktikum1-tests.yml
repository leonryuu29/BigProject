name: Praktikum1 Tests

on:
  push:
    paths:
      - "Praktikum1/**"
      - ".github/workflows/praktikum1-tests.yml"
  pull_request:
    paths:
      - "Praktikum1/**"
      - ".github/workflows/praktikum1-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: unittest (Python ${{ matrix.python }}, Redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        redis: ["5", "7"]
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: Praktikum1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Syntax prüfen
        run: python -m py_compile *.py tests/*.py

      - name: Tests ausführen
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v 2>&1 | tee test_output_ci.txt

      - name: Struktur- und Autocomplete-Smoke-Test (synthetische Daten)
        run: |
          python analyze_structure.py tests/sample_synthetic.json | head -20
          python load_data.py tests/sample_synthetic.json --flush
          printf 'the sti\n2\n\n' | python autocomplete.py

      - name: Testausgabe hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python }}-redis${{ matrix.redis }}
          path: Praktikum1/test_output_ci.txt
